name: Rollback Revision

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revisión de Cloud Run a restaurar"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  Rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Autenticación GCP (Deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Ejecutar Rollback
        run: |
          gcloud run services update-traffic ${{ vars.CLOUD_RUN_SERVICE }} \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --to-revisions="${{ inputs.revision }}=100"
            
          SERVICE_URL="$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} --region=${{ vars.GCP_REGION }} --project=${{ vars.GCP_PROJECT_ID }} --format='value(status.url)')"
          curl --fail --silent --show-error "${SERVICE_URL}/health"
          curl --fail --silent --show-error "${SERVICE_URL}/incidents"
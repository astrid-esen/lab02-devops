name: Promote Candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  Promote:
    runs-on: ubuntu-latest
    steps:
      - name: Autenticación GCP (Deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verificar y Promover
        run: |
          CANDIDATE_REVISION="$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} --region=${{ vars.GCP_REGION }} --project=${{ vars.GCP_PROJECT_ID }} --format=json | jq -r '.status.traffic[] | select(.tag == "candidate") | .revisionName')"
          if [ -z "$CANDIDATE_REVISION" ] || [ "$CANDIDATE_REVISION" == "null" ]; then exit 1; fi
          
          CANDIDATE_URL="$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} --region=${{ vars.GCP_REGION }} --project=${{ vars.GCP_PROJECT_ID }} --format=json | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')"
          curl --fail --silent --show-error "${CANDIDATE_URL}/health"
          curl --fail --silent --show-error "${CANDIDATE_URL}/incidents"
          
          gcloud run services update-traffic ${{ vars.CLOUD_RUN_SERVICE }} \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --to-revisions="${CANDIDATE_REVISION}=100"